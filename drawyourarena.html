<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>行動活動平面圖快速繪製系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 避免手機瀏覽器雙擊縮放及長按選取文字 */
        body {
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        /* 滾動條美化 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* 畫布格線背景 */
        .grid-bg {
            background-size: 20px 20px;
            background-image: 
                linear-gradient(to right, rgba(148, 163, 184, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(148, 163, 184, 0.1) 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- 頂部導覽列 -->
    <header class="bg-indigo-600 text-white px-4 py-3 shadow-md flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-compass-drafting text-2xl"></i>
            <div>
                <h1 class="text-base md:text-lg font-bold tracking-wider">現場平面圖快速繪製系統</h1>
                <p class="text-[10px] text-indigo-200 hidden md:block">同仁專用 · 行動/電腦雙端優化版</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <!-- 畫布大小選擇 -->
            <select id="canvasSizePreset" class="bg-indigo-700 text-white text-xs px-2 py-1.5 rounded border border-indigo-500 focus:outline-none">
                <option value="800x600">標準區域 (800x600)</option>
                <option value="1200x900">中型場地 (1200x900)</option>
                <option value="1600x1200">大型展館 (1600x1200)</option>
            </select>
            <button id="btnUndo" class="p-2 hover:bg-indigo-700 rounded transition text-xs" title="復原">
                <i class="fa-solid fa-arrow-rotate-left"></i>
            </button>
            <button id="btnClear" class="p-2 hover:bg-red-700 rounded transition text-xs" title="清空畫布">
                <i class="fa-solid fa-trash-can"></i>
            </button>
            <button id="btnSaveLocal" class="p-2 hover:bg-indigo-700 rounded transition text-xs hidden md:inline-flex items-center space-x-1">
                <i class="fa-solid fa-floppy-disk"></i>
                <span class="text-xs">暫存</span>
            </button>
            <button id="btnExport" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs px-3 py-1.5 rounded font-bold flex items-center space-x-1 shadow transition">
                <i class="fa-solid fa-download"></i>
                <span>導出圖片</span>
            </button>
        </div>
    </header>

    <!-- 主要內容區 -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">

        <!-- 左側/上方：工具與元件選單 -->
        <!-- 手機上改為上方橫向滑動，電腦上為左側直立面版 -->
        <aside class="w-full md:w-80 bg-white border-b md:border-b-0 md:border-r border-slate-200 flex flex-col shrink-0 z-10 max-h-[35vh] md:max-h-none overflow-hidden">
            <!-- 頁籤切換 (手機版收納) -->
            <div class="flex border-b border-slate-200 text-sm shrink-0">
                <button id="tabElements" class="flex-1 py-3 text-center border-b-2 border-indigo-600 font-bold text-indigo-600">
                    <i class="fa-solid fa-shapes mr-1"></i>活動元件
                </button>
                <button id="tabTools" class="flex-1 py-3 text-center border-b-2 border-transparent text-slate-500 hover:text-slate-800 font-medium">
                    <i class="fa-solid fa-pen-ruler mr-1"></i>繪圖與文字
                </button>
            </div>

            <!-- 頁籤內容容器 -->
            <div class="flex-1 overflow-y-auto p-3">
                <!-- 頁籤 1: 活動元件 -->
                <div id="panelElements" class="space-y-4">
                    <!-- 舞台與講台 -->
                    <div>
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">舞台與講台</h3>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="addElement('stage-main')" class="flex flex-col items-center justify-center p-2 border border-slate-200 rounded-lg hover:border-indigo-400 hover:bg-indigo-50/50 transition">
                                <div class="w-10 h-6 bg-amber-200 border-2 border-amber-500 rounded flex items-center justify-center text-[10px] font-bold">主舞台</div>
                                <span class="text-[11px] mt-1 text-slate-600">主舞台</span>
                            </button>
                            <button onclick="addElement('stage-sub')" class="flex flex-col items-center justify-center p-2 border border-slate-200 rounded-lg hover:border-indigo-400 hover:bg-indigo-50/50 transition">
                                <div class="w-8 h-5 bg-amber-100 border border-amber-400 rounded flex items-center justify-center text-[9px]">副舞台</div>
                                <span class="text-[11px] mt-1 text-slate-600">副舞台</span>
                            </button>
                            <button onclick="addElement('podium')" class="flex flex-col items-center justify-center p-2 border border-slate-200 rounded-lg hover:border-indigo-400 hover:bg-indigo-50/50 transition">
                                <div class="w-5 h-5 bg-yellow-600 border border-yellow-800 rounded flex items-center justify-center text-[8px] text-white">🎤</div>
                                <span class="text-[11px] mt-1 text-slate-600">司儀台</span>
                            </button>
                        </div>
                    </div>

                    <!-- 桌椅設施 -->
                    <div>
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">桌椅與席位</h3>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="addElement('table-long')" class="flex flex-col items-center justify-center p-2 border border-slate-200 rounded-lg hover:border-indigo-400 hover:bg-indigo-50/50 transition">
                                <div class="w-12 h-6 bg-orange-100 border border-orange-500 rounded flex items-center justify-center text-[9px]">長桌席</div>
                                <span class="text-[11px] mt-1 text-slate-600">長條桌</span>
                            </button>
                            <button onclick="addElement('table-round')" class="flex flex-col items-center justify-center p-2 border border-slate-200 rounded-lg hover:border-indigo-400 hover:bg-indigo-50/50 transition">
                                <div class="w-8 h-8 rounded-full bg-orange-100 border border-orange-500 flex items-center justify-center text-[9px]">圓桌</div>
                                <span class="text-[11px] mt-1 text-slate-600">圓桌席</span>
                            </button>
                            <button onclick="addElement('chair-row')" class="flex flex-col items-center justify-center p-2 border border-slate-200 rounded-lg hover:border-indigo-400 hover:bg-indigo-50/50 transition">
                                <div class="flex space-x-0.5 justify-center">
                                    <div class="w-3 h-3 bg-blue-100 border border-blue-500 rounded text-[7px] text-center">🪑</div>
                                    <div class="w-3 h-3 bg-blue-100 border border-blue-500 rounded text-[7px] text-center">🪑</div>
                                </div>
                                <span class="text-[11px] mt-1 text-slate-600">一排觀眾椅</span>
                            </button>
                        </div>
                    </div>

                    <!-- 活動常用硬體 -->
                    <div>
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">設備與隔間</h3>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="addElement('tent')" class="flex flex-col items-center justify-center p-2 border border-slate-200 rounded-lg hover:border-indigo-400 hover:bg-indigo-50/50 transition">
                                <div class="w-8 h-8 bg-sky-100 border-2 border-sky-500 flex items-center justify-center text-xs">⛺</div>
                                <span class="text-[11px] mt-1 text-slate-600">帳篷 (3x3)</span>
                            </button>
                            <button onclick="addElement('reception')" class="flex flex-col items-center justify-center p-2 border border-slate-200 rounded-lg hover:border-indigo-400 hover:bg-indigo-50/50 transition">
                                <div class="w-10 h-5 bg-teal-100 border border-teal-500 rounded flex items-center justify-center text-[9px] font-bold">服務台</div>
                                <span class="text-[11px] mt-1 text-slate-600">招待/接待處</span>
                            </button>
                            <button onclick="addElement('screen')" class="flex flex-col items-center justify-center p-2 border border-slate-200 rounded-lg hover:border-indigo-400 hover:bg-indigo-50/50 transition">
                                <div class="w-10 h-2 bg-slate-300 border border-slate-600 rounded"></div>
                                <span class="text-[11px] mt-1 text-slate-600">投影幕/電視</span>
                            </button>
                        </div>
                    </div>

                    <!-- 標示與景觀 -->
                    <div>
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">標示與美化</h3>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="addElement('exit')" class="flex flex-col items-center justify-center p-2 border border-slate-200 rounded-lg hover:border-indigo-400 hover:bg-indigo-50/50 transition">
                                <div class="w-8 h-4 bg-emerald-500 text-white text-[8px] font-bold rounded flex items-center justify-center">EXIT</div>
                                <span class="text-[11px] mt-1 text-slate-600">安全出口</span>
                            </button>
                            <button onclick="addElement('arrow-way')" class="flex flex-col items-center justify-center p-2 border border-slate-200 rounded-lg hover:border-indigo-400 hover:bg-indigo-50/50 transition">
                                <div class="text-slate-700 text-sm"><i class="fa-solid fa-arrow-up"></i></div>
                                <span class="text-[11px] mt-1 text-slate-600">動線指標</span>
                            </button>
                            <button onclick="addElement('plant')" class="flex flex-col items-center justify-center p-2 border border-slate-200 rounded-lg hover:border-indigo-400 hover:bg-indigo-50/50 transition">
                                <div class="w-5 h-5 rounded-full bg-green-500 border border-green-700 flex items-center justify-center text-xs">🌿</div>
                                <span class="text-[11px] mt-1 text-slate-600">景觀盆栽</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 頁籤 2: 繪圖與文字工具 -->
                <div id="panelTools" class="space-y-4 hidden">
                    <!-- 基本繪圖 -->
                    <div>
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">手動繪製區域</h3>
                        <div class="grid grid-cols-2 gap-2">
                            <button id="toolDrawWall" class="flex items-center justify-center space-x-2 p-2.5 border border-slate-200 rounded-lg hover:border-indigo-400 hover:bg-indigo-50 transition text-sm">
                                <i class="fa-solid fa-pen-nib text-slate-600"></i>
                                <span>繪製隔牆 (多邊形)</span>
                            </button>
                            <button id="toolDrawRect" class="flex items-center justify-center space-x-2 p-2.5 border border-slate-200 rounded-lg hover:border-indigo-400 hover:bg-indigo-50 transition text-sm">
                                <i class="fa-regular fa-square text-slate-600"></i>
                                <span>畫矩形塊</span>
                            </button>
                        </div>
                        <p class="text-[10px] text-slate-400 mt-1">點擊「繪製隔牆」後，在畫布上連續點選以畫出邊界，雙擊結束。</p>
                    </div>

                    <!-- 自訂標籤 -->
                    <div>
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">添加說明文字</h3>
                        <div class="space-y-2">
                            <div class="flex space-x-1">
                                <input type="text" id="txtLabelInput" placeholder="輸入說明文字..." class="flex-1 px-3 py-1.5 border border-slate-300 rounded text-sm focus:outline-none focus:border-indigo-500">
                                <button onclick="addTextLabel()" class="bg-indigo-600 text-white px-3 rounded text-sm hover:bg-indigo-700 transition">新增</button>
                            </div>
                            <div class="flex items-center justify-between text-xs text-slate-500">
                                <span>預設字體大小:</span>
                                <select id="labelSize" class="border border-slate-300 rounded px-1 py-0.5">
                                    <option value="14">中 (14px)</option>
                                    <option value="18">大 (18px)</option>
                                    <option value="24">特大 (24px)</option>
                                    <option value="12">小 (12px)</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- 貼心繪製輔助 -->
                    <div>
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">對齊與網格</h3>
                        <div class="flex items-center justify-between p-2 bg-slate-50 rounded-lg border border-slate-100">
                            <span class="text-xs text-slate-600 font-medium">對齊網格 (Snap to Grid)</span>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="chkSnapToGrid" checked class="sr-only peer">
                                <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 元件清單底部的縮放操作（電腦/手機都很實用） -->
            <div class="bg-slate-100 p-2.5 border-t border-slate-200 shrink-0 flex items-center justify-between text-xs text-slate-500">
                <span id="canvasDimInfo">尺寸: 800 x 600</span>
                <div class="flex items-center space-x-2">
                    <button id="btnZoomOut" class="w-6 h-6 bg-white border border-slate-300 rounded flex items-center justify-center hover:bg-slate-50 shadow-sm"><i class="fa-solid fa-magnifying-glass-minus text-[10px]"></i></button>
                    <span id="zoomLevel">100%</span>
                    <button id="btnZoomIn" class="w-6 h-6 bg-white border border-slate-300 rounded flex items-center justify-center hover:bg-slate-50 shadow-sm"><i class="fa-solid fa-magnifying-glass-plus text-[10px]"></i></button>
                </div>
            </div>
        </aside>

        <!-- 右側/中間：主畫布區域 -->
        <main class="flex-1 relative overflow-hidden bg-slate-300 flex items-center justify-center p-4">
            
            <!-- 實際的繪圖區塊外包裝 (允許在內部滾動或拖移) -->
            <div id="canvasViewport" class="w-full h-full overflow-auto flex items-center justify-center relative">
                
                <!-- 畫布核心 -->
                <div id="floorplanCanvas" class="bg-white shadow-2xl relative grid-bg transition-shadow duration-300 origin-center" style="width: 800px; height: 600px;">
                    <!-- SVG 畫布：用於繪製牆線、隔間與連線 -->
                    <svg id="svgOverlay" class="absolute inset-0 w-full h-full pointer-events-none z-10">
                        <!-- 所有繪製好的線條會動態渲染在此 -->
                    </svg>

                    <!-- HTML 元件容器 -->
                    <div id="elementsContainer" class="absolute inset-0 z-20 overflow-hidden">
                        <!-- 拖曳元件會被放置在這裡 -->
                    </div>
                </div>

            </div>

            <!-- 浮動提示：手機版貼心提示 -->
            <div id="phoneTip" class="absolute bottom-4 left-4 bg-slate-900/80 text-white text-[10px] px-3 py-1.5 rounded-full pointer-events-none z-30 flex items-center space-x-1 md:hidden">
                <i class="fa-solid fa-hand-pointer animate-bounce"></i>
                <span>雙指縮放或拖曳移動、單指點選/拖移物件</span>
            </div>
        </main>

        <!-- 選取元件時的「右側/底部屬性控制面板」 -->
        <!-- 電腦顯示在最右側，手機彈出在底端 -->
        <div id="controlPanel" class="hidden absolute bottom-0 md:top-0 md:right-0 md:bottom-auto w-full md:w-72 bg-white border-t md:border-t-0 md:border-l border-slate-200 shadow-2xl md:shadow-none z-30 flex flex-col p-4 space-y-3 shrink-0 transform translate-y-full md:translate-y-0 transition-transform duration-300 max-h-[50vh] md:max-h-full overflow-y-auto">
            <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                <h2 class="font-bold text-sm text-indigo-700 flex items-center">
                    <i class="fa-solid fa-sliders mr-1.5"></i>
                    <span>元件屬性調整</span>
                </h2>
                <button onclick="deselectAll()" class="text-slate-400 hover:text-slate-600 text-xs">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- 元件屬性細節 -->
            <div class="space-y-3 text-xs">
                <!-- 名稱自訂 -->
                <div>
                    <label class="block text-slate-500 font-semibold mb-1">自訂名稱/標題</label>
                    <input type="text" id="propName" class="w-full px-2.5 py-1.5 border border-slate-300 rounded focus:outline-none focus:border-indigo-500">
                </div>

                <!-- 旋轉控制 (對手機極為友善) -->
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="text-slate-500 font-semibold">旋轉角度</label>
                        <span id="propAngleVal" class="text-indigo-600 font-bold">0°</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <input type="range" id="propRotation" min="0" max="360" class="flex-1 accent-indigo-600">
                        <div class="flex space-x-1 shrink-0">
                            <button onclick="adjustRotation(-45)" class="px-2 py-1 bg-slate-100 rounded border border-slate-300 font-bold hover:bg-slate-200">-45°</button>
                            <button onclick="adjustRotation(45)" class="px-2 py-1 bg-slate-100 rounded border border-slate-300 font-bold hover:bg-slate-200">+45°</button>
                        </div>
                    </div>
                </div>

                <!-- 縮放比例 -->
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="text-slate-500 font-semibold">大小縮放</label>
                        <span id="propScaleVal" class="text-indigo-600 font-bold">100%</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <input type="range" id="propScale" min="50" max="250" class="flex-1 accent-indigo-600">
                        <div class="flex space-x-1 shrink-0">
                            <button onclick="adjustScale(-10)" class="w-8 py-1 bg-slate-100 rounded border border-slate-300 font-bold hover:bg-slate-200">-</button>
                            <button onclick="adjustScale(10)" class="w-8 py-1 bg-slate-100 rounded border border-slate-300 font-bold hover:bg-slate-200">+</button>
                        </div>
                    </div>
                </div>

                <!-- 顏色選取 (若適用) -->
                <div id="propColorSection">
                    <label class="block text-slate-500 font-semibold mb-1">主題顏色</label>
                    <div class="flex space-x-2">
                        <button onclick="changeColor('#fef3c7', '#d97706')" class="w-6 h-6 rounded-full border border-amber-400 bg-amber-100" title="琥珀黃"></button>
                        <button onclick="changeColor('#fee2e2', '#dc2626')" class="w-6 h-6 rounded-full border border-red-400 bg-red-100" title="珊瑚紅"></button>
                        <button onclick="changeColor('#dbeafe', '#2563eb')" class="w-6 h-6 rounded-full border border-blue-400 bg-blue-100" title="天藍色"></button>
                        <button onclick="changeColor('#f0fdf4', '#16a34a')" class="w-6 h-6 rounded-full border border-green-400 bg-green-100" title="森綠色"></button>
                        <button onclick="changeColor('#f3f4f6', '#374151')" class="w-6 h-6 rounded-full border border-slate-400 bg-slate-100" title="經典灰"></button>
                    </div>
                </div>

                <!-- 快捷層級與複製 -->
                <div class="pt-2 border-t border-slate-100 grid grid-cols-2 gap-2">
                    <button onclick="bringToFront()" class="py-2 border border-slate-200 rounded hover:bg-slate-50 flex items-center justify-center space-x-1">
                        <i class="fa-solid fa-layer-group"></i>
                        <span>置於頂層</span>
                    </button>
                    <button onclick="cloneSelected()" class="py-2 border border-slate-200 rounded hover:bg-slate-50 flex items-center justify-center space-x-1">
                        <i class="fa-solid fa-copy"></i>
                        <span>複製元件</span>
                    </button>
                </div>

                <!-- 刪除元件 -->
                <button onclick="deleteSelected()" class="w-full py-2.5 bg-red-50 text-red-600 hover:bg-red-100 rounded-lg font-bold flex items-center justify-center space-x-1.5 transition">
                    <i class="fa-solid fa-trash"></i>
                    <span>刪除此元件</span>
                </button>
            </div>
        </div>

    </div>

    <!-- 輸出中 Modal -->
    <div id="modalExporting" class="fixed inset-0 bg-slate-900/60 flex items-center justify-center hidden z-50">
        <div class="bg-white p-6 rounded-xl shadow-2xl flex flex-col items-center space-y-4 max-w-sm text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-indigo-600 border-t-transparent"></div>
            <div>
                <h3 class="font-bold text-lg text-slate-800">正在生成高畫質平面圖...</h3>
                <p class="text-xs text-slate-500 mt-1">請稍候，系統正為您轉檔中。</p>
            </div>
        </div>
    </div>

    <!-- 提示框元件 (取代 alert) -->
    <div id="toastMessage" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-lg shadow-lg hidden z-50 transition-opacity duration-300">
        提示訊息
    </div>

    <!-- html2canvas: 用於完美截圖畫布導出為 PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        // --- 系統全域變數 ---
        const canvas = document.getElementById('floorplanCanvas');
        const svgOverlay = document.getElementById('svgOverlay');
        const container = document.getElementById('elementsContainer');
        const controlPanel = document.getElementById('controlPanel');
        const snapGridCheckbox = document.getElementById('chkSnapToGrid');

        let elements = []; // 存儲所有畫布上的元件物件數據
        let selectedElement = null; // 當前選取的元件 DOM 元素
        let activeTool = 'select'; // select, draw-wall, draw-rect
        let currentZoom = 1; // 畫布縮放比率
        
        // 繪牆/多邊形專用暫存變數
        let drawPoints = [];
        let drawLines = [];
        let tempLine = null;

        // 復原/歷史紀錄堆疊
        let historyStack = [];
        const MAX_HISTORY = 15;

        // 預置活動元件結構模板
        const elementTemplates = {
            'stage-main': { name: '主舞台', w: 180, h: 80, bg: '#fef3c7', border: '#d97706', icon: '🎭', shape: 'rect' },
            'stage-sub': { name: '副舞台', w: 100, h: 50, bg: '#fffbeb', border: '#f59e0b', icon: '🎭', shape: 'rect' },
            'podium': { name: '講台', w: 35, h: 35, bg: '#b45309', border: '#78350f', icon: '🎤', shape: 'square' },
            'table-long': { name: '長條桌席', w: 120, h: 50, bg: '#ffedd5', border: '#ea580c', icon: '🛋️', shape: 'rect' },
            'table-round': { name: '圓桌席', w: 80, h: 80, bg: '#ffedd5', border: '#ea580c', icon: '🍽️', shape: 'circle' },
            'chair-row': { name: '一排座椅', w: 140, h: 25, bg: '#eff6ff', border: '#2563eb', icon: '🪑 🪑 🪑', shape: 'rect' },
            'tent': { name: '阿里山帳篷', w: 100, h: 100, bg: '#e0f2fe', border: '#0284c7', icon: '⛺', shape: 'square' },
            'reception': { name: '服務台', w: 110, h: 45, bg: '#ccfbf1', border: '#0d9488', icon: '💁', shape: 'rect' },
            'screen': { name: '投影/LED螢幕', w: 90, h: 12, bg: '#f3f4f6', border: '#4b5563', icon: '📺', shape: 'rect' },
            'exit': { name: '安全出口', w: 70, h: 30, bg: '#10b981', border: '#047857', icon: '🚪 EXIT', shape: 'rect', color: '#ffffff' },
            'arrow-way': { name: '動線指標', w: 45, h: 45, bg: '#f1f5f9', border: '#475569', icon: '⬆️', shape: 'circle' },
            'plant': { name: '景觀植栽', w: 40, h: 40, bg: '#ecfdf5', border: '#059669', icon: '🌿', shape: 'circle' }
        };

        // --- 初始化設定與載入 ---
        window.addEventListener('DOMContentLoaded', () => {
            setupTabs();
            setupCanvasPreset();
            setupZoomControls();
            setupAttributesControls();
            setupWallDrawingTools();
            setupUndoClearButtons();
            loadFromLocalStorage();
            saveHistory(); // 初始歷史紀錄
        });

        // 頁籤切換
        function setupTabs() {
            const tabElements = document.getElementById('tabElements');
            const tabTools = document.getElementById('tabTools');
            const panelElements = document.getElementById('panelElements');
            const panelTools = document.getElementById('panelTools');

            tabElements.addEventListener('click', () => {
                tabElements.className = "flex-1 py-3 text-center border-b-2 border-indigo-600 font-bold text-indigo-600";
                tabTools.className = "flex-1 py-3 text-center border-b-2 border-transparent text-slate-500 hover:text-slate-800 font-medium";
                panelElements.classList.remove('hidden');
                panelTools.classList.add('hidden');
                cancelWallDrawing();
            });

            tabTools.addEventListener('click', () => {
                tabTools.className = "flex-1 py-3 text-center border-b-2 border-indigo-600 font-bold text-indigo-600";
                tabElements.className = "flex-1 py-3 text-center border-b-2 border-transparent text-slate-500 hover:text-slate-800 font-medium";
                panelTools.classList.remove('hidden');
                panelElements.classList.add('hidden');
            });
        }

        // --- 歷史紀錄 (Undo) 系統 ---
        function saveHistory() {
            const canvasState = {
                canvasWidth: canvas.style.width,
                canvasHeight: canvas.style.height,
                elements: JSON.parse(JSON.stringify(elements)), // 深拷貝
                svgContent: svgOverlay.innerHTML
            };

            if (historyStack.length > 0) {
                // 如果跟上一個狀態一模一樣，就不重複紀錄
                const prevStateStr = JSON.stringify(historyStack[historyStack.length - 1]);
                if (prevStateStr === JSON.stringify(canvasState)) return;
            }

            historyStack.push(canvasState);
            if (historyStack.length > MAX_HISTORY) {
                historyStack.shift();
            }
            saveToLocalStorage();
        }

        function restoreHistory() {
            if (historyStack.length <= 1) {
                showToast("已經是最初狀態囉！");
                return;
            }
            historyStack.pop(); // 彈出當前狀態
            const prevState = historyStack[historyStack.length - 1];

            // 恢復畫布尺寸
            canvas.style.width = prevState.canvasWidth;
            canvas.style.height = prevState.canvasHeight;
            document.getElementById('canvasSizePreset').value = `${parseInt(prevState.canvasWidth)}x${parseInt(prevState.canvasHeight)}`;
            document.getElementById('canvasDimInfo').textContent = `尺寸: ${parseInt(prevState.canvasWidth)} x ${parseInt(prevState.canvasHeight)}`;

            // 恢復 SVG
            svgOverlay.innerHTML = prevState.svgContent;

            // 恢復元件
            container.innerHTML = '';
            elements = [];
            
            deselectAll();

            prevState.elements.forEach(item => {
                recreateHTMLItem(item);
            });

            showToast("已還原上一步");
        }

        // 快速訊息提示
        function showToast(msg) {
            const toast = document.getElementById('toastMessage');
            toast.textContent = msg;
            toast.classList.remove('hidden');
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 2000);
        }

        // --- 畫布尺寸預設調整 ---
        function setupCanvasPreset() {
            const select = document.getElementById('canvasSizePreset');
            select.addEventListener('change', (e) => {
                const [w, h] = e.target.value.split('x');
                canvas.style.width = `${w}px`;
                canvas.style.height = `${h}px`;
                document.getElementById('canvasDimInfo').textContent = `尺寸: ${w} x ${h}`;
                
                // 置中對齊
                canvas.style.transform = `scale(${currentZoom})`;
                saveHistory();
            });
        }

        // --- 縮放與平移 (適合手機操作) ---
        function setupZoomControls() {
            const zoomVal = document.getElementById('zoomLevel');
            document.getElementById('btnZoomIn').addEventListener('click', () => {
                if (currentZoom < 2.5) {
                    currentZoom += 0.15;
                    updateZoomDisplay();
                }
            });
            document.getElementById('btnZoomOut').addEventListener('click', () => {
                if (currentZoom > 0.4) {
                    currentZoom -= 0.15;
                    updateZoomDisplay();
                }
            });
        }

        function updateZoomDisplay() {
            document.getElementById('zoomLevel').textContent = `${Math.round(currentZoom * 100)}%`;
            canvas.style.transform = `scale(${currentZoom})`;
        }

        // --- 點擊按鈕新增元件 ---
        function addElement(type) {
            const template = elementTemplates[type];
            if (!template) return;

            // 計算新增至中心點
            const viewport = document.getElementById('canvasViewport');
            const rect = canvas.getBoundingClientRect();
            
            // 相對於畫布左上角
            let x = 100;
            let y = 100;
            
            // 隨機微調防止重疊
            x += Math.floor(Math.random() * 50);
            y += Math.floor(Math.random() * 50);

            const elementData = {
                id: 'el-' + Date.now(),
                type: type,
                name: template.name,
                x: x,
                y: y,
                w: template.w,
                h: template.h,
                angle: 0,
                scale: 100,
                bg: template.bg,
                border: template.border,
                icon: template.icon,
                shape: template.shape,
                textColor: template.color || '#334155'
            };

            recreateHTMLItem(elementData);
            saveHistory();
        }

        // 從 JSON 數據生成 HTML 元件實體
        function recreateHTMLItem(data) {
            elements.push(data);

            const item = document.createElement('div');
            item.id = data.id;
            item.className = 'absolute cursor-move select-none flex flex-col items-center justify-center font-bold text-center border-2 transition-shadow duration-150';
            
            // 特殊形狀處理
            if (data.shape === 'circle') {
                item.style.borderRadius = '50%';
            } else {
                item.style.borderRadius = '0.375rem'; // rounded-md
            }

            // 套用基本外觀
            updateItemVisual(item, data);

            // 點選與拖移事件處理 (支援手機 Touch & 電腦 Mouse)
            setupDragAndTouchEvents(item, data);

            container.appendChild(item);
            
            // 自動選取新元件
            selectItem(item, data);
        }

        // 更新元件之視覺屬性
        function updateItemVisual(dom, data) {
            dom.style.width = `${data.w}px`;
            dom.style.height = `${data.h}px`;
            dom.style.left = `${data.x}px`;
            dom.style.top = `${data.y}px`;
            dom.style.backgroundColor = data.bg;
            dom.style.borderColor = data.border;
            dom.style.color = data.textColor;
            dom.style.transform = `rotate(${data.angle}deg) scale(${data.scale / 100})`;
            
            // 文字大小隨縮放變化
            const baseFontSize = data.type === 'exit' ? 10 : 12;
            dom.style.fontSize = `${baseFontSize * (data.scale / 100)}px`;

            // 內容填充
            dom.innerHTML = `
                <span class="pointer-events-none select-none text-[1.2em] mb-0.5">${data.icon}</span>
                <span class="pointer-events-none select-none px-1 text-center font-medium leading-tight">${data.name}</span>
            `;
        }

        // --- 手指/滑鼠 拖曳元件核心邏輯 (極度相容行動端) ---
        function setupDragAndTouchEvents(dom, data) {
            let isDragging = false;
            let startX = 0;
            let startY = 0;
            let initialX = 0;
            let initialY = 0;

            // 開始事件
            const dragStart = (e) => {
                // 如果當前是繪圖工具，不進行拖曳
                if (activeTool !== 'select') return;

                isDragging = true;
                selectItem(dom, data);

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                startX = clientX;
                startY = clientY;
                initialX = data.x;
                initialY = data.y;

                dom.classList.add('shadow-xl', 'z-40');
                
                // 阻擋手機端背景滾動行為
                if (e.touches) e.preventDefault();
            };

            // 移動中事件
            const dragMove = (e) => {
                if (!isDragging) return;

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                // 須扣除外部畫布縮放比例的位移量
                const dx = (clientX - startX) / currentZoom;
                const dy = (clientY - startY) / currentZoom;

                let newX = initialX + dx;
                let newY = initialY + dy;

                // 對齊網格功能 (20px 一格)
                if (snapGridCheckbox.checked) {
                    newX = Math.round(newX / 20) * 20;
                    newY = Math.round(newY / 20) * 20;
                }

                // 限制在畫布範圍
                const canvasW = canvas.clientWidth;
                const canvasH = canvas.clientHeight;
                newX = Math.max(0, Math.min(canvasW - data.w, newX));
                newY = Math.max(0, Math.min(canvasH - data.h, newY));

                data.x = newX;
                data.y = newY;

                dom.style.left = `${newX}px`;
                dom.style.top = `${newY}px`;

                // 同步更新控制面板 (若有選取)
                if (selectedElement === dom) {
                    // 不需要每次都更新，但可以保持位置最新
                }
            };

            // 結束事件
            const dragEnd = () => {
                if (!isDragging) return;
                isDragging = false;
                dom.classList.remove('shadow-xl', 'z-40');
                saveHistory(); // 儲存拖移後的狀態
            };

            // Mouse 事件
            dom.addEventListener('mousedown', dragStart);
            window.addEventListener('mousemove', dragMove);
            window.addEventListener('mouseup', dragEnd);

            // Touch 手機觸控事件
            dom.addEventListener('touchstart', dragStart, { passive: false });
            window.addEventListener('touchmove', dragMove, { passive: false });
            window.addEventListener('touchend', dragEnd);
        }

        // --- 選取元件與屬性設定面板 ---
        function selectItem(dom, data) {
            deselectAll();

            selectedElement = dom;
            dom.style.outline = "3px solid #6366f1";
            dom.style.outlineOffset = "2px";

            // 填寫屬性面板資料
            document.getElementById('propName').value = data.name;
            document.getElementById('propRotation').value = data.angle;
            document.getElementById('propAngleVal').textContent = `${data.angle}°`;
            document.getElementById('propScale').value = data.scale;
            document.getElementById('propScaleVal').textContent = `${data.scale}%`;

            // 打開控制面板 (在手機上這會流暢滑上來)
            controlPanel.classList.remove('hidden');
            controlPanel.classList.remove('translate-y-full');
        }

        // 取消全選
        function deselectAll() {
            if (selectedElement) {
                selectedElement.style.outline = "none";
                selectedElement = null;
            }
            controlPanel.classList.add('hidden');
            controlPanel.classList.add('translate-y-full');
        }

        // 點擊畫布空白處取消選取
        canvas.addEventListener('click', (e) => {
            if (e.target === canvas || e.target === svgOverlay || e.target === container) {
                deselectAll();
            }
        });

        // --- 屬性操控細節 ---
        function setupAttributesControls() {
            const propName = document.getElementById('propName');
            const propRotation = document.getElementById('propRotation');
            const propScale = document.getElementById('propScale');

            // 名稱變更
            propName.addEventListener('input', (e) => {
                if (!selectedElement) return;
                const id = selectedElement.id;
                const data = elements.find(el => el.id === id);
                if (data) {
                    data.name = e.target.value;
                    updateItemVisual(selectedElement, data);
                }
            });
            propName.addEventListener('change', () => saveHistory());

            // 角度變更
            propRotation.addEventListener('input', (e) => {
                if (!selectedElement) return;
                const id = selectedElement.id;
                const data = elements.find(el => el.id === id);
                if (data) {
                    data.angle = parseInt(e.target.value);
                    document.getElementById('propAngleVal').textContent = `${data.angle}°`;
                    updateItemVisual(selectedElement, data);
                }
            });
            propRotation.addEventListener('change', () => saveHistory());

            // 大小變更
            propScale.addEventListener('input', (e) => {
                if (!selectedElement) return;
                const id = selectedElement.id;
                const data = elements.find(el => el.id === id);
                if (data) {
                    data.scale = parseInt(e.target.value);
                    document.getElementById('propScaleVal').textContent = `${data.scale}%`;
                    updateItemVisual(selectedElement, data);
                }
            });
            propScale.addEventListener('change', () => saveHistory());
        }

        // 微調按鈕: 旋轉角度
        function adjustRotation(val) {
            if (!selectedElement) return;
            const id = selectedElement.id;
            const data = elements.find(el => el.id === id);
            if (data) {
                let angle = (data.angle + val) % 360;
                if (angle < 0) angle += 360;
                data.angle = angle;
                document.getElementById('propRotation').value = angle;
                document.getElementById('propAngleVal').textContent = `${angle}°`;
                updateItemVisual(selectedElement, data);
                saveHistory();
            }
        }

        // 微調按鈕: 大小比例
        function adjustScale(val) {
            if (!selectedElement) return;
            const id = selectedElement.id;
            const data = elements.find(el => el.id === id);
            if (data) {
                let scale = Math.min(250, Math.max(50, data.scale + val));
                data.scale = scale;
                document.getElementById('propScale').value = scale;
                document.getElementById('propScaleVal').textContent = `${scale}%`;
                updateItemVisual(selectedElement, data);
                saveHistory();
            }
        }

        // 置於最上層
        function bringToFront() {
            if (!selectedElement) return;
            const id = selectedElement.id;
            const index = elements.findIndex(el => el.id === id);
            if (index !== -1) {
                const [item] = elements.splice(index, 1);
                elements.push(item); // 移至底層陣列最尾端
                container.appendChild(selectedElement); // 重放入 DOM 結構，自動渲染於最上
                saveHistory();
                showToast("元件已置於最頂層");
            }
        }

        // 複製當前元件
        function cloneSelected() {
            if (!selectedElement) return;
            const id = selectedElement.id;
            const source = elements.find(el => el.id === id);
            if (source) {
                const cloneData = {
                    ...source,
                    id: 'el-' + Date.now(),
                    x: source.x + 30, // 位移避免重合
                    y: source.y + 30
                };
                recreateHTMLItem(cloneData);
                saveHistory();
                showToast("已複製元件");
            }
        }

        // 變更主色調
        function changeColor(bg, border) {
            if (!selectedElement) return;
            const id = selectedElement.id;
            const data = elements.find(el => el.id === id);
            if (data) {
                data.bg = bg;
                data.border = border;
                updateItemVisual(selectedElement, data);
                saveHistory();
            }
        }

        // 刪除選取元件
        function deleteSelected() {
            if (!selectedElement) return;
            const id = selectedElement.id;
            elements = elements.filter(el => el.id !== id);
            selectedElement.remove();
            deselectAll();
            saveHistory();
            showToast("元件已刪除");
        }

        // --- 繪製文字標籤 ---
        function addTextLabel() {
            const input = document.getElementById('txtLabelInput');
            const text = input.value.trim();
            if (!text) {
                showToast("請輸入欲顯示的文字！");

            };

        // --- 牆面與區域繪製工具 (多邊形與線段) ---
        function setupWallDrawingTools() {
            const btnDrawWall = document.getElementById('toolDrawWall');
            const btnDrawRect = document.getElementById('toolDrawRect');

            btnDrawWall.addEventListener('click', () => {
                if (activeTool === 'draw-wall') {
                    cancelWallDrawing();
                } else {
                    deselectAll();
                    activeTool = 'draw-wall';
                    drawPoints = [];
                    btnDrawWall.classList.add('border-indigo-600', 'bg-indigo-50', 'text-indigo-600');
                    canvas.style.cursor = 'crosshair';
                    showToast("已啟用繪線模式，在畫布上連續點擊繪線，雙擊空白完成！");
                }
            });

            // 連點/雙擊結束牆面繪製
            canvas.addEventListener('click', (e) => {
                if (activeTool !== 'draw-wall') return;
                
                // 計算相對於 svgOverlay 的坐標
                const rect = canvas.getBoundingClientRect();
                let x = (e.clientX - rect.left) / currentZoom;
                let y = (e.clientY - rect.top) / currentZoom;

                // 輔助對齊網格
                if (snapGridCheckbox.checked) {
                    x = Math.round(x / 20) * 20;
                    y = Math.round(y / 20) * 20;
                }

                drawPoints.push({ x, y });

                // 在 SVG 上畫一個臨時節點點
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("cx", x);
                circle.setAttribute("cy", y);
                circle.setAttribute("r", "4");
                circle.setAttribute("fill", "#6366f1");
                circle.setAttribute("class", "temp-draw-node");
                svgOverlay.appendChild(circle);

                // 如果多於一個點，連接前一個點
                if (drawPoints.length > 1) {
                    const prev = drawPoints[drawPoints.length - 2];
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", prev.x);
                    line.setAttribute("y1", prev.y);
                    line.setAttribute("x2", x);
                    line.setAttribute("y2", y);
                    line.setAttribute("stroke", "#475569");
                    line.setAttribute("stroke-width", "5");
                    line.setAttribute("stroke-linecap", "round");
                    line.setAttribute("class", "temp-draw-line");
                    svgOverlay.appendChild(line);
                }
            });

            // 雙擊結束多邊形繪製
            canvas.addEventListener('dblclick', (e) => {
                if (activeTool !== 'draw-wall' || drawPoints.length < 2) return;
                
                // 清理臨時標記
                document.querySelectorAll('.temp-draw-node').forEach(el => el.remove());
                document.querySelectorAll('.temp-draw-line').forEach(el => el.remove());

                // 將畫好線段固定到 SVG 中
                for (let i = 0; i < drawPoints.length - 1; i++) {
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", drawPoints[i].x);
                    line.setAttribute("y1", drawPoints[i].y);
                    line.setAttribute("x2", drawPoints[i+1].x);
                    line.setAttribute("y2", drawPoints[i+1].y);
                    line.setAttribute("stroke", "#1e293b"); // 極深灰牆線
                    line.setAttribute("stroke-width", "6");
                    line.setAttribute("stroke-linecap", "round");
                    
                    // 點擊線條也可以被刪除
                    line.style.cursor = 'pointer';
                    line.addEventListener('click', (ev) => {
                        ev.stopPropagation();
                        if (confirm('確定要刪除這條隔間線嗎？')) {
                            line.remove();
                            saveHistory();
                        }
                    });

                    svgOverlay.appendChild(line);
                }

                cancelWallDrawing();
                saveHistory();
                showToast("已成功繪製隔牆！點擊線段可以將其刪除。");
            });
        }

        // 取消繪圖模式
        function cancelWallDrawing() {
            activeTool = 'select';
            drawPoints = [];
            document.querySelectorAll('.temp-draw-node').forEach(el => el.remove());
            document.querySelectorAll('.temp-draw-line').forEach(el => el.remove());
            
            const btnDrawWall = document.getElementById('toolDrawWall');
            btnDrawWall.className = "flex items-center justify-center space-x-2 p-2.5 border border-slate-200 rounded-lg hover:border-indigo-400 hover:bg-indigo-50 transition text-sm";
            canvas.style.cursor = 'default';
        }

        // --- 撤銷、清空與導出設定 ---
        function setupUndoClearButtons() {
            // 撤銷 (Undo) 按鈕
            document.getElementById('btnUndo').addEventListener('click', () => {
                restoreHistory();
            });

            // 清空畫布按鈕
            document.getElementById('btnClear').addEventListener('click', () => {
                if (confirm('確定要清空畫布上所有的佈局元件與線條嗎？')) {
                    container.innerHTML = '';
                    svgOverlay.innerHTML = '';
                    elements = [];
                    deselectAll();
                    saveHistory();
                    showToast("畫布已清空");
                }
            });

            // 存檔與導出 PNG 按鈕
            document.getElementById('btnExport').addEventListener('click', exportCanvasToImage);

            // 本地儲存按鈕
            document.getElementById('btnSaveLocal').addEventListener('click', () => {
                saveToLocalStorage();
                showToast("畫布狀態已成功暫存！下次打開可繼續編輯。");
            });
        }

        // --- 核心導出功能：利用 html2canvas 生成優質 PNG 圖檔 ---
        async function exportCanvasToImage() {
            deselectAll(); // 導出前必先取消選取框，確保美觀

            const exportModal = document.getElementById('modalExporting');
            exportModal.classList.remove('hidden'); // 顯示加載畫面

            setTimeout(() => {
                // 將畫布回復為原 100% 比例以便截出高解析度圖形
                const savedZoom = currentZoom;
                currentZoom = 1;
                canvas.style.transform = 'scale(1)';

                html2canvas(canvas, {
                    backgroundColor: '#ffffff',
                    scale: 2, // 2倍超高像素
                    useCORS: true,
                    logging: false
                }).then(renderedCanvas => {
                    // 還原原本縮放比例
                    currentZoom = savedZoom;
                    canvas.style.transform = `scale(${currentZoom})`;
                    
                    // 下載
                    const link = document.createElement('a');
                    link.download = `活動平面配置圖_${getFormattedDate()}.png`;
                    link.href = renderedCanvas.toDataURL('image/png');
                    link.click();

                    exportModal.classList.add('hidden'); // 關閉加載
                    showToast("已成功導出高畫質平面圖圖片！");
                }).catch(err => {
                    exportModal.classList.add('hidden');
                    showToast("導出失敗，請重試或截圖保存");
                    console.error(err);
                });
            }, 300);
        }

        // 格式化日期格式
        function getFormattedDate() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const h = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            return `${y}${m}${d}_${h}${min}`;
        }

        // --- 本地瀏覽器數據持久化 (LocalStorage) ---
        function saveToLocalStorage() {
            const dataToSave = {
                canvasWidth: canvas.style.width,
                canvasHeight: canvas.style.height,
                elements: elements,
                svgContent: svgOverlay.innerHTML
            };
            localStorage.setItem('quick_floorplan_saved', JSON.stringify(dataToSave));
        }

        function loadFromLocalStorage() {
            const savedData = localStorage.getItem('quick_floorplan_saved');
            if (savedData) {
                try {
                    const data = JSON.parse(savedData);
                    
                    // 設定尺寸
                    canvas.style.width = data.canvasWidth || '800px';
                    canvas.style.height = data.canvasHeight || '600px';
                    document.getElementById('canvasSizePreset').value = `${parseInt(data.canvasWidth)}x${parseInt(data.canvasHeight)}`;
                    document.getElementById('canvasDimInfo').textContent = `尺寸: ${parseInt(data.canvasWidth)} x ${parseInt(data.canvasHeight)}`;

                    // 載入 SVG 隔間線
                    if (data.svgContent) {
                        svgOverlay.innerHTML = data.svgContent;
                        // 為加載進來的線段重新添加事件監聽
                        svgOverlay.querySelectorAll('line').forEach(line => {
                            line.style.cursor = 'pointer';
                            line.addEventListener('click', (ev) => {
                                ev.stopPropagation();
                                if (confirm('確定要刪除這條隔間線嗎？')) {
                                    line.remove();
                                    saveHistory();
                                }
                            });
                        });
                    }

                    // 重建元件
                    if (data.elements && data.elements.length > 0) {
                        data.elements.forEach(item => {
                            recreateHTMLItem(item);
                        });
                    }
                } catch(e) {
                    console.error("載入本地暫存數據發生錯誤", e);
                }
            }
        }
    </script>
</body>
</html>
